name: repository-quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate notebook JSON
        run: python -m json.tool red_wine_quality_modeling.ipynb > /dev/null
      - name: Validate dataset is non-empty CSV
        run: |
          python - <<'PY'
          import csv
          with open('winequality-red.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.reader(f))
          if len(rows) < 2:
              raise SystemExit('Dataset is empty or missing rows')
          PY
